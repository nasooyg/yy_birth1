<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영은이의 마음을 맞춰 봐~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #fff6e8;
    --bg2: #f7e4c9;
    --card: #fffdf9;
    --ink: #4f3120;
    --ink-soft: #8a6446;
    --fur: #b9773f;        /* 푸들 털 */
    --fur-light: #d9a26a;
    --biscuit: #f3d9b1;
    --blush: #f6c2b0;
    --cream: #f1e2cc;
    --accent: #a8622a;     /* 버튼 */
    --accent-dark: #6f3d15;
    --dark: #3a2314;       /* 눈, 코 */
    --shadow: rgba(140, 90, 40, .28);
    --font: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2b1e16; --bg2: #21160f; --card: #3e2e22; --ink: #fbead4; --ink-soft: #d2b08a;
      --fur: #c98a52; --fur-light: #e0ad78; --biscuit: #6b4f36; --blush: #8f5a4a; --cream: #57402d;
      --accent: #d59254; --accent-dark: #7a4a20; --dark: #1c110a; --shadow: rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #2b1e16; --bg2: #21160f; --card: #3e2e22; --ink: #fbead4; --ink-soft: #d2b08a;
    --fur: #c98a52; --fur-light: #e0ad78; --biscuit: #6b4f36; --blush: #8f5a4a; --cream: #57402d;
    --accent: #d59254; --accent-dark: #7a4a20; --dark: #1c110a; --shadow: rgba(0, 0, 0, .4);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    background-color: var(--bg);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* 배경 장식 */
  .deco-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .deco { position: absolute; animation: bob 5s ease-in-out infinite; }
  .deco svg { width: 100%; height: 100%; display: block; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-9px) rotate(calc(var(--r, 0deg) + 6deg)); } }

  .app {
    position: relative; z-index: 1;
    max-width: 440px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    padding: 28px 20px 40px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .screen { display: none; text-align: center; }
  .screen.active { display: block; animation: pop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(14px); } to { opacity: 1; transform: none; } }

  /* 곱슬곱슬 털뭉치 카드 */
  .cloud-card {
    position: relative;
    background: var(--card);
    border-radius: 64px;
    padding: 44px 26px 34px;
    margin-top: 40px;
    box-shadow: 0 14px 0 var(--biscuit), 0 26px 40px var(--shadow);
  }
  .cloud-card::before, .cloud-card::after {
    content: ""; position: absolute; background: var(--card); border-radius: 50%; z-index: -1;
  }
  .cloud-card::before { width: 110px; height: 110px; top: -40px; left: 34px; }
  .cloud-card::after  { width: 140px; height: 140px; top: -56px; right: 40px; }
  .cloud-card > * { position: relative; }

  .badge-circle {
    width: 150px; height: 150px; margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--biscuit);
    display: grid; place-items: center;
    box-shadow: 0 0 0 10px var(--cream), 0 0 0 20px color-mix(in srgb, var(--cream) 50%, transparent);
    overflow: hidden;
  }
  .badge-circle svg { width: 128px; height: 128px; margin-top: 8px; }

  h1 { font-weight: 400; font-size: 30px; line-height: 1.4; margin: 0 0 12px; }
  h2 { font-weight: 400; font-size: 24px; line-height: 1.45; margin: 0 0 22px; }
  p.sub { margin: 0 0 26px; color: var(--ink-soft); font-size: 18px; line-height: 1.6; }

  /* 버튼 */
  .btn {
    font-family: inherit; font-size: 21px; color: #fff;
    background: var(--accent);
    border: 0; border-radius: 999px;
    padding: 17px 34px; width: 100%;
    box-shadow: 0 8px 0 var(--accent-dark);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  :root[data-theme="dark"] .btn { color: #2b1508; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #2b1508; } }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn:focus-visible, .opt:focus-visible, input:focus-visible { outline: 4px solid var(--fur-light); outline-offset: 3px; }

  /* 진행 바 */
  .progress { position: relative; height: 22px; background: var(--card); border-radius: 999px; margin: 0 8px 30px; box-shadow: inset 0 3px 0 rgba(0,0,0,.06); }
  .progress-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--biscuit), var(--fur)); transition: width .4s cubic-bezier(.34,1.56,.64,1); min-width: 22px; position: relative; }
  .progress-fill::after { content: "🐾"; position: absolute; right: -8px; top: -9px; font-size: 24px; }
  .q-count { color: var(--ink-soft); font-size: 17px; margin-bottom: 10px; }

  /* 선택지 */
  .opts { display: grid; gap: 14px; }
  .opt {
    font-family: inherit; font-size: 17px; color: var(--ink); line-height: 1.45;
    background: var(--card); border: 4px solid var(--c, var(--biscuit));
    border-radius: 999px; padding: 15px 22px;
    box-shadow: 0 6px 0 var(--c, var(--biscuit));
    cursor: pointer; transition: transform .12s, background .12s;
  }
  .opt:nth-child(1) { --c: var(--blush); }
  .opt:nth-child(2) { --c: var(--biscuit); }
  .opt:nth-child(3) { --c: var(--fur-light); }
  .opt:nth-child(4) { --c: var(--cream); }
  .opt:active { transform: translateY(4px); }
  .opt.picked { background: var(--biscuit); border-color: var(--fur); }

  /* 결과 */
  .gift-circle {
    width: 170px; height: 170px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--biscuit);
    display: grid; place-items: center; font-size: 84px;
    box-shadow: 0 0 0 10px var(--cream), 0 0 0 20px color-mix(in srgb, var(--cream) 50%, transparent);
  }

  /* 입력 */
  .field { display: block; text-align: left; margin-bottom: 16px; }
  .field span { display: block; font-size: 17px; color: var(--ink-soft); margin: 0 0 6px 18px; }
  input {
    width: 100%; font-family: inherit; font-size: 19px; color: var(--ink);
    background: color-mix(in srgb, var(--biscuit) 45%, var(--card));
    border: 4px solid transparent; border-radius: 999px;
    padding: 14px 22px;
  }
  input::placeholder { color: var(--ink-soft); opacity: .75; }
  input:focus { border-color: var(--fur); outline: none; }
  input.bad { border-color: #d9534f; }
  .hint { min-height: 24px; margin: 4px 0 14px; color: #c23c38; font-size: 17px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hint { color: #ff9a92; } }
  :root[data-theme="dark"] .hint { color: #ff9a92; }

  .ghost { background: none; border: 0; font-family: inherit; color: var(--ink-soft); font-size: 17px; margin-top: 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }


  /* 뒤로가기 버튼 */
  .back {
    display: flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; margin: 0 0 14px; padding: 0;
    border: 0; border-radius: 50%;
    background: var(--card); color: var(--accent);
    box-shadow: 0 5px 0 var(--biscuit), 0 10px 18px var(--shadow);
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .back svg { width: 26px; height: 26px; }
  .back:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--biscuit); }
  .back:focus-visible { outline: 4px solid var(--fur-light); outline-offset: 3px; }
  .back-row { text-align: left; }

  /* 선물 사진 */
  .pic { width: 100%; height: 100%; display: grid; place-items: center; }
  .pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .pic svg { width: 72%; height: 72%; }
  .gift-circle { overflow: hidden; }

  /* 선물 고르기 */
  .gift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; margin-bottom: 26px; }
  .gift-item {
    font-family: inherit; font-size: 15px; color: var(--ink); line-height: 1.35;
    background: none; border: 0; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .gift-thumb {
    width: 108px; height: 108px; border-radius: 50%; overflow: hidden;
    background: var(--biscuit); display: grid; place-items: center;
    box-shadow: 0 0 0 5px var(--cream);
    transition: box-shadow .15s, transform .15s;
  }
  .gift-item.on .gift-thumb { box-shadow: 0 0 0 6px var(--accent); transform: translateY(-3px); }
  .gift-item.on span { color: var(--accent); }
  .gift-item:focus-visible { outline: 4px solid var(--fur-light); outline-offset: 4px; border-radius: 20px; }

  #giftDesc, #doneMsg, #qText, .opt, .scene-q, .cell .cap { white-space: pre-line; }
  .credit { margin: 16px 0 0; font-size: 15px; color: var(--ink-soft); }

  /* ===== 그림 선택 화면 (전체 화면) ===== */
  .app.wide { padding-left: 14px; padding-right: 14px; }
  .scene-wrap { display: flex; flex-direction: column; gap: 14px; }
  .scene-q {
    font-size: 20px; line-height: 1.45; margin: 0 6px;
    color: var(--ink); text-align: center;
  }
  .scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cell {
    font-family: inherit; color: var(--ink); cursor: pointer;
    border: 0; padding: 12px 8px 10px; border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform .12s, box-shadow .12s;
  }
  .cell .art { width: 100%; max-width: 128px; }
  .cell .art svg { width: 100%; height: auto; display: block; }
  .cell .cap { font-size: 15px; line-height: 1.35; min-height: 2.7em; display: flex; align-items: center; text-align: center; }
  .cell:active { transform: scale(.96); }
  .cell.picked { transform: scale(.94); }
  .cell:focus-visible { outline: 4px solid var(--fur-light); outline-offset: 3px; }

  /* 창문 */
  .window-frame {
    background: var(--accent); padding: 14px; border-radius: 34px;
    box-shadow: 0 10px 0 var(--accent-dark), 0 20px 32px var(--shadow);
  }
  .window-frame .scene-grid { gap: 14px; }
  .window-frame .cell { background: linear-gradient(180deg, #d7ecfb 0%, #f3f8fd 100%); border-radius: 22px 22px 8px 8px; }
  .window-frame .cell .cap { color: #4f3120; }
  .window-frame .cell.picked { box-shadow: inset 0 0 0 5px var(--butter, #f3d9b1); }
  .sill { height: 16px; margin: 10px 4px 0; border-radius: 999px; background: var(--fur-light); }

  /* 식탁 */
  .table-top {
    background: var(--fur-light); padding: 16px 12px 20px; border-radius: 34px;
    box-shadow: 0 10px 0 var(--accent), 0 20px 32px var(--shadow);
    position: relative;
  }
  .table-top::before {
    content: ""; position: absolute; inset: 10px 8px; border-radius: 26px;
    border: 3px dashed color-mix(in srgb, var(--card) 55%, transparent);
    pointer-events: none;
  }
  .table-top .cell { background: var(--card); border-radius: 50% 50% 34px 34px; }
  .table-top .cell.picked { box-shadow: 0 0 0 5px var(--accent); }

  /* 집 */
  .house { filter: drop-shadow(0 16px 26px var(--shadow)); }
  .roof { display: block; width: 100%; height: auto; margin-bottom: -2px; }
  .house-body { background: var(--accent); padding: 12px; border-radius: 0 0 30px 30px; }
  .house-body .cell { background: var(--card); border-radius: 18px; }
  .house-body .cell .cap { color: var(--ink); }
  .house-body .cell.picked { box-shadow: inset 0 0 0 5px var(--fur-light); }

  @media (max-width: 340px) { .scene-q { font-size: 18px; } .cell .cap { font-size: 13.5px; } }

  @media (prefers-reduced-motion: reduce) {
    .deco, .screen.active { animation: none; }
    .progress-fill, .btn, .opt, .back, .gift-thumb, .cell { transition: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 갈색 푸들 얼굴 -->
    <symbol id="poodle" viewBox="0 0 200 200">
      <!-- 귀 (곱슬 뭉치) -->
      <g style="fill:var(--fur)">
        <circle cx="38" cy="108" r="30"/><circle cx="28" cy="138" r="24"/><circle cx="50" cy="152" r="23"/><circle cx="24" cy="112" r="18"/>
        <circle cx="162" cy="108" r="30"/><circle cx="172" cy="138" r="24"/><circle cx="150" cy="152" r="23"/><circle cx="176" cy="112" r="18"/>
      </g>
      <!-- 머리 위 뽀글 뭉치 -->
      <g style="fill:var(--fur)">
        <circle cx="100" cy="36" r="27"/><circle cx="72" cy="52" r="21"/><circle cx="128" cy="52" r="21"/><circle cx="100" cy="62" r="20"/>
      </g>
      <circle cx="100" cy="112" r="56" style="fill:var(--fur)"/>
      <!-- 주둥이 -->
      <ellipse cx="100" cy="134" rx="32" ry="25" style="fill:var(--biscuit)"/>
      <!-- 볼터치 -->
      <circle cx="66" cy="128" r="9" style="fill:var(--blush);opacity:.75"/>
      <circle cx="134" cy="128" r="9" style="fill:var(--blush);opacity:.75"/>
      <!-- 눈 -->
      <circle cx="76" cy="106" r="8" style="fill:var(--dark)"/><circle cx="124" cy="106" r="8" style="fill:var(--dark)"/>
      <circle cx="79" cy="103" r="2.8" fill="#fff"/><circle cx="127" cy="103" r="2.8" fill="#fff"/>
      <!-- 코, 입 -->
      <ellipse cx="100" cy="124" rx="11" ry="8" style="fill:var(--dark)"/>
      <ellipse cx="97" cy="121.5" rx="3" ry="1.8" fill="#fff" opacity=".5"/>
      <path d="M100 132 V138 M100 138 Q92 148 82 140 M100 138 Q108 148 118 140" fill="none" style="stroke:var(--dark)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="100" cy="150" rx="8" ry="9" style="fill:var(--blush)"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 100">
      <path d="M50 84 C14 58 8 32 26 20 C38 13 48 19 50 30 C52 19 62 13 74 20 C92 32 86 58 50 84 Z" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,10 61,38 91,40 68,59 76,88 50,72 24,88 32,59 9,40 39,38" fill="currentColor" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
    </symbol>
    <!-- 뽀글뽀글 털뭉치(구름) -->
    <symbol id="cloud" viewBox="0 0 120 70">
      <g fill="currentColor"><circle cx="30" cy="42" r="20"/><circle cx="54" cy="28" r="24"/><circle cx="82" cy="30" r="22"/><circle cx="98" cy="46" r="18"/><rect x="18" y="42" width="84" height="22" rx="11"/></g>
    </symbol>
    <symbol id="paw" viewBox="0 0 100 100">
      <g fill="currentColor"><ellipse cx="50" cy="66" rx="24" ry="20"/><circle cx="20" cy="42" r="10"/><circle cx="40" cy="26" r="11"/><circle cx="62" cy="26" r="11"/><circle cx="82" cy="42" r="10"/></g>
    </symbol>
    <symbol id="bone" viewBox="0 0 120 60">
      <g fill="currentColor"><rect x="20" y="20" width="80" height="20" rx="10"/><circle cx="18" cy="18" r="13"/><circle cx="18" cy="42" r="13"/><circle cx="102" cy="18" r="13"/><circle cx="102" cy="42" r="13"/></g>
    </symbol>
  </defs>
</svg>
<div class="deco-layer" id="decoLayer" aria-hidden="true"></div>

<main class="app">

  <!-- 1. 시작 -->
  <section class="screen active" id="s-start">
    <div class="cloud-card">
      <div class="badge-circle" aria-hidden="true"><svg viewBox="0 0 200 200"><use href="#poodle"/></svg></div>
      <h1>생일을 맞은<br>영은이의 마음을 맞춰 봐~</h1>
      <p class="sub">질문에 답하면 깜짝 선물이 나와요 🐾</p>
      <button class="btn" id="startBtn">시작하기</button>
      <p class="credit">by 어진, 수영</p>
    </div>
  </section>

  <!-- 2. 질문 -->
  <section class="screen" id="s-quiz">
    <div class="back-row"><button class="back" type="button" data-back aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button></div>
    <div class="q-count" id="qCount"></div>
    <div class="progress" aria-hidden="true"><div class="progress-fill" id="bar"></div></div>
    <div class="cloud-card">
      <h2 id="qText"></h2>
      <div class="opts" id="opts"></div>
    </div>
  </section>


  <!-- 2-b. 그림으로 고르는 질문 -->
  <section class="screen" id="s-scene">
    <div class="back-row"><button class="back" type="button" data-back aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button></div>
    <div class="scene-wrap" id="sceneBody"></div>
  </section>

  <!-- 3. 결과 -->
  <section class="screen" id="s-result">
    <div class="back-row"><button class="back" type="button" data-back aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button></div>
    <div class="cloud-card">
      <p class="sub" style="margin-bottom:14px">영은이에게 딱 어울리는 선물은…</p>
      <div class="gift-circle" id="giftPic" aria-hidden="true"></div>
      <h2 id="giftName" style="margin-bottom:10px"></h2>
      <p class="sub" id="giftDesc"></p>
      <button class="btn" id="claimBtn">이걸로 할래요!</button>
      <button class="ghost" id="swapBtn">다른 선물로 바꿀래요</button>
    </div>
  </section>

  <!-- 4. 선물 바꾸기 -->
  <section class="screen" id="s-swap">
    <div class="back-row"><button class="back" type="button" data-back aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button></div>
    <div class="cloud-card">
      <h2>영은이가 원하는<br>선물로 바꿀 수 있어요!</h2>
      <p class="sub">마음에 드는 걸 골라주세요</p>
      <div class="gift-grid" id="giftGrid"></div>
      <button class="btn" id="swapDoneBtn">이걸로 할래요!</button>
    </div>
  </section>

  <!-- 5. 완료 -->
  <section class="screen" id="s-done">
    <div class="back-row"><button class="back" type="button" data-back aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button></div>
    <div class="cloud-card">
      <div class="gift-circle" id="donePic" aria-hidden="true"></div>
      <h1 id="doneTitle"></h1>
      <p class="sub" id="donePicked"></p>
      <p class="sub" id="doneMsg"></p>
      <button class="ghost" id="againBtn">처음부터 다시 하기</button>
    </div>
  </section>

</main>


<script>
  /* ============================================================
     ★ 여기만 고치면 됩니다 ★

     - 화면 문구는 아래 TEXT 에서 고치세요.
       <br> 을 넣으면 줄이 바뀝니다. (doneMsg 는 \n 을 쓰세요)
     - 질문·선택지는 QUESTIONS, 선물 설명은 GIFTS 에서 고치세요.
       문장 안에 \n 을 넣으면 그 자리에서 줄이 바뀝니다.
       예) "아침밥 시간!\n오늘 식탁에 올라온 건?"
     - 선물 사진은 images 폴더에 넣으세요.

    vanity: `<svg viewBox="0 0 120 96"><rect x="6" y="6" width="108" height="82" rx="8" fill="#f2e3cd"/><ellipse cx="60" cy="34" rx="26" ry="28" fill="#e9f2f8" stroke="#d9a26a" stroke-width="5"/><g fill="#ffe7a3"><circle cx="30" cy="20" r="5"/><circle cx="90" cy="20" r="5"/><circle cx="24" cy="42" r="5"/><circle cx="96" cy="42" r="5"/></g><rect x="20" y="64" width="80" height="10" rx="5" fill="#d9a26a"/><rect x="40" y="52" width="10" height="12" rx="4" fill="#e8607d"/><rect x="58" y="50" width="12" height="14" rx="5" fill="#a8557f"/><rect x="76" y="54" width="9" height="10" rx="4" fill="#f6c2b0"/></svg>`,
    desk: `<svg viewBox="0 0 120 96"><rect x="6" y="6" width="108" height="82" rx="8" fill="#f2e3cd"/><rect x="14" y="60" width="92" height="9" rx="4" fill="#c98a52"/><rect x="22" y="69" width="8" height="18" rx="4" fill="#c98a52"/><rect x="90" y="69" width="8" height="18" rx="4" fill="#c98a52"/><path d="M42 36h40v24H42z" fill="#e9f2f8" stroke="#8a6446" stroke-width="4" stroke-linejoin="round"/><rect x="36" y="58" width="52" height="5" rx="2.5" fill="#8a6446"/><g stroke="#a8d8a0" stroke-width="4" stroke-linecap="round"><path d="M50 46h24M50 53h16"/></g><rect x="20" y="46" width="12" height="14" rx="3" fill="#e8607d"/></svg>`
  };

  // 질문 번호(0부터) → 화면 종류, 칸 라벨, 그림
  const SCENES = {
    2: { kind: "window", caps: ["쨍쨍한 햇살", "보송보송 구름", "창문 두드리는 비", "서늘하고 맑은 공기"], art: ["sun", "cloudy", "rain", "crisp"] },
    3: { kind: "table",  caps: ["빵이랑 커피", "따끈한 국에 밥", "요거트에 과일", "물 한 잔이면 끝"], art: ["bread", "soup", "yogurt", "water"] },
    7: { kind: "house",  caps: ["벽에 기대 앉기", "바닥에 드러눕기", "화장대 앞에 잠깐", "블로그 쓰는 책상"], art: ["wallseat", "floorlie", "vanity", "desk"] }
  };

  const ROOF = `<svg class="roof" viewBox="0 0 320 76" preserveAspectRatio="none"><path d="M160 4 L316 66 a10 10 0 0 1-4 10 H8 a10 10 0 0 1-4-10 Z" fill="#a8622a"/></svg>`;

  function renderScene(qi) {
    const sc = SCENES[qi], cur = QUESTIONS[qi];
    const cells = sc.caps.map((cap, i) =>
      `<button class="cell" type="button" data-i="${i}"><span class="art">${ART[sc.art[i]]}</span><span class="cap">${cap}</span></button>`
    ).join("");

    let inner;
    if (sc.kind === "window") inner = `<div class="window-frame"><div class="scene-grid">${cells}</div></div><div class="sill"></div>`;
    else if (sc.kind === "table") inner = `<div class="table-top"><div class="scene-grid">${cells}</div></div>`;
    else inner = `<div class="house">${ROOF}<div class="house-body"><div class="scene-grid">${cells}</div></div></div>`;

    $("sceneBody").innerHTML = `<p class="scene-q">${cur.q}</p>${inner}`;
    $("sceneBody").querySelectorAll(".cell").forEach(b => {
      b.onclick = () => {
        b.classList.add("picked");
        answers[qi] = +b.dataset.i;
        setTimeout(() => { idx++; if (idx < QUESTIONS.length) renderQ(); else showResult(); }, 240);
      };
    });
    show("s-scene");
  }

  function renderQ() {
    document.body.dataset.q = idx;
    if (SCENES[idx]) { renderScene(idx); return; }
    const cur = QUESTIONS[idx];
    $("qCount").textContent = `${idx + 1} / ${QUESTIONS.length}`;
    $("bar").style.width = `${(idx / QUESTIONS.length) * 100}%`;
    $("qText").textContent = cur.q;
    const box = $("opts");
    box.innerHTML = "";
    cur.o.forEach((opt, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = opt[0];
      b.onclick = () => {
        b.classList.add("picked");
        answers[idx] = i;
        setTimeout(() => {
          idx++;
          if (idx < QUESTIONS.length) renderQ(); else showResult();
        }, 220);
      };
      box.appendChild(b);
    });
    show("s-quiz");
  }

  function calcGift() {
    const cnt = { light: 0, chair: 0, clock: 0 };
    let shape = 0;
    answers.forEach((pick, qi) => {
      const [, cat, s] = QUESTIONS[qi].o[pick];
      cnt[cat]++; shape += s;
    });
    let cat = "light";                        // 동점이면 조명 → 의자 → 시계 순
    if (cnt.chair > cnt[cat]) cat = "chair";
    if (cnt.clock > cnt[cat]) cat = "clock";
    return cat === "light" ? (shape > 0 ? "light1" : "light2")
         : cat === "chair" ? (shape > 0 ? "chair1" : "chair2")
         :                   (shape > 0 ? "clock1" : "clock2");
  }

  function showResult() {
    resultKey = finalKey = calcGift();
    const g = GIFTS[resultKey];
    const pic = $("giftPic");
    pic.innerHTML = "";
    pic.appendChild(giftPicture(resultKey));
    $("giftName").textContent = g.name;
    $("giftDesc").textContent = g.desc;
    show("s-result");
  }

  function renderSwap() {
    swapPick = finalKey;
    const grid = $("giftGrid");
    grid.innerHTML = "";
    GIFT_KEYS.forEach(key => {
      const b = document.createElement("button");
      b.className = "gift-item" + (key === swapPick ? " on" : "");
      b.type = "button";
      b.dataset.key = key;
      const circle = document.createElement("div");
      circle.className = "gift-thumb";
      circle.appendChild(giftPicture(key));
      const label = document.createElement("span");
      label.textContent = GIFTS[key].name;
      b.append(circle, label);
      b.onclick = () => {
        swapPick = key;
        grid.querySelectorAll(".gift-item").forEach(x => x.classList.toggle("on", x.dataset.key === key));
      };
      grid.appendChild(b);
    });
    show("s-swap");
  }

  function goDone() {
    const g = GIFTS[finalKey];
    const pic = $("donePic");
    pic.innerHTML = "";
    pic.appendChild(giftPicture(finalKey));
    $("donePicked").textContent = `고른 선물: ${g.name}`;
    show("s-done");
  }

  $("startBtn").onclick = () => { idx = 0; answers = []; renderQ(); };
  $("claimBtn").onclick = () => { finalKey = resultKey; goDone(); };
  $("swapBtn").onclick = renderSwap;
  $("swapDoneBtn").onclick = () => { finalKey = swapPick; goDone(); };
  $("againBtn").onclick = () => show("s-start");

  // 뒤로가기
  function goBack() {
    const cur = document.querySelector(".screen.active").id;
    if (cur === "s-quiz" || cur === "s-scene") {
      if (idx > 0) { idx--; answers.length = idx; renderQ(); } else show("s-start");
    } else if (cur === "s-result") {
      idx = QUESTIONS.length - 1; answers.length = idx; renderQ();
    } else if (cur === "s-swap") {
      show("s-result");
    } else if (cur === "s-done") {
      show(finalKey === resultKey ? "s-result" : "s-swap");
    }
  }
  document.querySelectorAll("[data-back]").forEach(b => b.onclick = goBack);

  // ---------- 화면 문구 적용 ----------
  const setHTML = (sel, html) => { const el = document.querySelector(sel); if (el) el.innerHTML = html; };
  setHTML("#s-start h1", TEXT.title);
  setHTML("#s-start .sub", TEXT.subtitle);
  setHTML("#startBtn", TEXT.startBtn);
  setHTML(".credit", TEXT.credit);
  setHTML("#s-result .sub", TEXT.resultLead);
  setHTML("#s-swap h2", TEXT.swapTitle);
  setHTML("#s-swap .sub", TEXT.swapSub);
  $("doneTitle").textContent = TEXT.doneTitle;
  $("doneMsg").textContent = TEXT.doneMsg;
</script>
</body>
</html>
